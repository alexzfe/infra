- name: Require the tunnel token
  ansible.builtin.assert:
    that: tunnel_token | length > 0
    fail_msg: "Set TUNNEL_TOKEN, e.g. TUNNEL_TOKEN=$(terraform -chdir=../terraform output -raw tunnel_token)"
    quiet: true

- name: Create /opt/edge
  ansible.builtin.file:
    path: /opt/edge
    state: directory
    mode: "0755"

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/edge/Caddyfile
    mode: "0644"
  notify: Restart caddy

- name: Write the edge compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/edge/compose.yml
    mode: "0644"

- name: Write the tunnel token
  ansible.builtin.copy:
    dest: /opt/edge/.env
    content: "TUNNEL_TOKEN={{ tunnel_token }}\n"
    mode: "0600"
  no_log: true

- name: Start Caddy and cloudflared
  community.docker.docker_compose_v2:
    project_src: /opt/edge
    state: present
    pull: missing
