- name: Require the tunnel token
  ansible.builtin.assert:
    that: tunnel_token | length > 0
    fail_msg: "Set TUNNEL_TOKEN, e.g. TUNNEL_TOKEN=$(terraform -chdir=../terraform output -raw tunnel_token)"
    quiet: true

- name: Create /opt/edge
  ansible.builtin.file:
    path: /opt/edge
    state: directory
    mode: "0755"

- name: Write the nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/edge/nginx.conf
    mode: "0644"
  notify: Reload nginx

- name: Write the edge compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/edge/compose.yml
    mode: "0644"

- name: Write the tunnel token
  ansible.builtin.copy:
    dest: /opt/edge/.env
    content: "TUNNEL_TOKEN={{ tunnel_token }}\n"
    mode: "0600"
  no_log: true

# remove_orphans takes down services that left the compose file (Caddy, before nginx).
- name: Start nginx and cloudflared
  community.docker.docker_compose_v2:
    project_src: /opt/edge
    state: present
    pull: missing
    remove_orphans: true

- name: Remove Caddy leftovers
  ansible.builtin.file:
    path: /opt/edge/Caddyfile
    state: absent

- name: Remove Caddy's data volume
  community.docker.docker_volume:
    name: edge_caddy_data
    state: absent
