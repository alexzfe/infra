- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - unattended-upgrades
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Reboot for kernel updates at a quiet hour
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "09:00";

# The default list only covers Ubuntu's archives; Docker's repo would otherwise never update. Docker's live-restore
# (docker role) keeps containers running while dockerd restarts for the upgrade.
- name: Let unattended upgrades update Docker
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-docker
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern { "origin=Docker,codename=${distro_codename},label=Docker CE"; };

# The box has no swap out of the box. A little gives the kernel room to page out idle memory before the OOM killer
# has to pick a process; low swappiness keeps it a last resort.
- name: Create the swapfile
  ansible.builtin.shell:
    cmd: fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
    creates: /swapfile

- name: Write the swap unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/swapfile.swap
    mode: "0644"
    content: |
      [Swap]
      What=/swapfile

      [Install]
      WantedBy=swap.target

- name: Enable swap
  ansible.builtin.systemd_service:
    name: swapfile.swap
    state: started
    enabled: true
    daemon_reload: true

- name: Prefer RAM over swap
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-swappiness.conf
    mode: "0644"
    content: "vm.swappiness = 10\n"
  notify: Apply sysctl

# Tailscale SSH replaces OpenSSH. Break-glass access is the Hetzner web console.
- name: Disable OpenSSH
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - ssh.socket
    - ssh.service

- name: Create the deploy user
  ansible.builtin.user:
    name: deploy
    shell: /bin/bash

- name: Install deploy-app
  ansible.builtin.copy:
    src: deploy-app
    dest: /usr/local/bin/deploy-app
    mode: "0755"

# deploy may run deploy-app and nothing else: it can switch an app to another tag of its own image,
# not run arbitrary containers. (Adding it to the docker group would make it root-equivalent.)
- name: Let deploy run deploy-app as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/deploy
    mode: "0440"
    content: "deploy ALL=(root) NOPASSWD: /usr/local/bin/deploy-app\n"
    validate: visudo -cf %s

# The homeserver pulls nightly backups as backup-pull (Tailscale SSH, tag:backup). Its login shell accepts only
# `backup-app <app> [stored]`, so a stolen homeserver can read a backup and nothing more. Not `backup`: Ubuntu
# already has a system user by that name.
- name: Install backup-app and backup-shell
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  loop:
    - backup-app
    - backup-shell

- name: Create the backup-pull user
  ansible.builtin.user:
    name: backup-pull
    shell: /usr/local/bin/backup-shell

- name: Let backup-pull run backup-app as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/backup-pull
    mode: "0440"
    content: "backup-pull ALL=(root) NOPASSWD: /usr/local/bin/backup-app\n"
    validate: visudo -cf %s
