# The public sites on the VPS. The one list both halves read:
# Terraform turns it into DNS records and tunnel routes, Ansible into nginx routes and compose files.
#
# Hostnames stay one level under xlobax.com (`arcade-staging`, not `arcade.staging`): Cloudflare's free
# Universal SSL certificate covers `*.xlobax.com` only, so a deeper name would fail TLS.
#
# Each app's image serves plain HTTP on `port` and answers `health_path` with a 2xx once it's ready.
#
# Optional, for apps that need more than a static site:
#   volume             Container path of a persistent volume, `<app>-<env>-data`. Ansible creates it and deploys
#                      never remove it, so it survives every deploy and rollback.
#   env                Plain environment variables, for both envs. `{host}` becomes that env's hostname. Not for
#                      secrets: this repo is public.
#   healthcheck: image Use the image's own HEALTHCHECK instead of wget on `health_path` (images without wget).
#   mem_limit          Prod's memory cap (default 1g).
#   staging_mem_limit  Staging's memory cap (default 256m).
#   max_body_size      nginx's `client_max_body_size` (default 1m).
#   stream_paths       Paths that stream responses (Server-Sent Events): no proxy buffering, long read timeout.
#   edge_cache         true: Cloudflare caches every response (HTML too) at the edge for up to 7 days, except
#                      `health_path`. Only for sites that change only by deploy: the release workflow must pass
#                      `purge_cache: true` to deploy-app, which purges the hostname after each deploy.
#   respect_origin_ttl true: browsers get the origin's Cache-Control as is. Without it, Cloudflare raises a short
#                      max-age on the files it caches by extension (e.g. .gz) to the zone's 4 h browser TTL.
#   backup             Command, run in the prod container, that writes a backup archive to stdout. The homeserver
#                      pulls it nightly (see homeserver/).
apps:
  - name: website
    image: ghcr.io/alexzfe/personal-website
    port: 8080
    health_path: /
    hosts:
      prod: xlobax.com
      staging: staging.xlobax.com

  - name: arcade
    image: ghcr.io/alexzfe/boardgame-trainer
    port: 8080
    health_path: /
    hosts:
      prod: arcade.xlobax.com
      staging: arcade-staging.xlobax.com

  - name: settle
    image: ghcr.io/alexzfe/settle
    port: 4380
    health_path: /health
    healthcheck: image
    # A login hashes with scrypt at 128 MiB; 256m would leave too little for the server itself.
    staging_mem_limit: 512m
    # Documents and Blueprints go up to 51 MiB.
    max_body_size: 64m
    stream_paths:
      - /events
    volume: /data
    # The Google sign-in client: Settle's google-sign-in wizard writes it on the box. deploy-app
    # rewrites .env, so it has its own file.
    env_file: google.env
    env:
      SETTLE_PUBLIC_ORIGIN: https://{host}
      # The origin is reachable through Cloudflare alone, so CF-Connecting-IP is the visitor.
      SETTLE_TRUSTED_PROXY: cloudflare
    backup: [node, packages/server/dist/backup.js]
    hosts:
      prod: settle.xlobax.com
      staging: settle-staging.xlobax.com

  - name: ufc
    image: ghcr.io/alexzfe/fight-card-website
    port: 8080
    # A static file the Astro build emits; `/` would also pass, but this doesn't depend on the data.
    health_path: /healthz
    # Static, and only changes by deploy (the data refresh deploys too), so HTML is served from the edge.
    edge_cache: true
    hosts:
      prod: ufc.xlobax.com
      staging: ufc-staging.xlobax.com

  - name: ufc-data
    image: ghcr.io/alexzfe/fightcard-engine
    port: 8080
    health_path: /healthz
    # The public /v1/ API that the site (ufc.xlobax.com) builds from, and the scheduler that refreshes it, in one
    # container (fightcard-engine's docs/SERVICE.md). Its Debian nginx base has no wget: the image has its own check.
    healthcheck: image
    # The published generations nginx serves, plus the working data/, the ufcstats cookie and the history db.
    volume: /srv/fightcard
    # Scoring (pandas + LightGBM) peaks at a few hundred MB; staging runs it too.
    mem_limit: 1g
    staging_mem_limit: 768m
    env:
      FIGHTCARD_HOST: "{host}"
      # Only prod scrapes ufcstats and ESPN: both envs share the box's IP. Staging rescores and republishes the
      # data on its own volume.
      FIGHTCARD_FETCH_HOST: ufc-data.xlobax.com
      # The finish model research publishes (terraform/main.tf: bucket fightcard-models). Public read, so no
      # credential here. Both envs pull it, so staging runs the model prod does.
      FIGHTCARD_MODEL_URL: https://models.xlobax.com
    # The history store, the one part of the volume a rescrape can't rebuild: a consistent copy, as a .tgz holding
    # history/history.sqlite (restore it into the volume's state/).
    backup: [fightcard, history, backup, --db, /srv/fightcard/state/history/history.sqlite]
    # /v1/snapshot.tar.gz says max-age=60; without this browsers would keep it for 4 h.
    respect_origin_ttl: true
    hosts:
      prod: ufc-data.xlobax.com
      staging: ufc-data-staging.xlobax.com
