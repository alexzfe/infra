# Reusable deploy step that app repos call:
#   uses: alexzfe/infra/.github/workflows/deploy-app.yml@main
# Joins the tailnet as an ephemeral tag:ci node, which the ACL only lets in as `deploy`,
# and `deploy` may only run deploy-app.
name: deploy-app

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      env:
        description: staging or prod
        type: string
        required: true
      tag:
        description: Image tag to run (the commit SHA)
        type: string
        required: true
      url:
        description: Public URL to smoke-test after the deploy
        type: string
        required: true
    secrets:
      TS_CI_OAUTH_CLIENT_ID:
        required: true
      TS_CI_OAUTH_SECRET:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploys of one app-env run in order; a newer pending one replaces an older pending one.
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.env }}
      url: ${{ inputs.url }}
    steps:
      - uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          oauth-client-id: ${{ secrets.TS_CI_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CI_OAUTH_SECRET }}
          tags: tag:ci

      # Inputs go through env, never straight into the script, so a value can't inject shell code.
      - name: deploy-app ${{ inputs.app }} ${{ inputs.env }} ${{ inputs.tag }}
        env:
          APP: ${{ inputs.app }}
          APP_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
        # deploy's login shell turns this into `sudo deploy-app ...` and refuses anything else.
        run: ssh -o StrictHostKeyChecking=no deploy@xlobax-vps deploy-app "$APP" "$APP_ENV" "$TAG"

      - name: Smoke test through Cloudflare
        env:
          URL: ${{ inputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$URL"
