# Reusable deploy step that app repos call:
#   uses: alexzfe/infra/.github/workflows/deploy-app.yml@main
# Joins the tailnet as an ephemeral tag:ci node, which the ACL only lets in as `deploy`,
# and `deploy` may only run deploy-app.
name: deploy-app

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      env:
        description: staging or prod
        type: string
        required: true
      tag:
        description: Image tag to run (the commit SHA)
        type: string
        required: true
      url:
        description: Public URL to smoke-test after the deploy
        type: string
        required: true
      purge_cache:
        description: Purge the URL's hostname from Cloudflare's cache after deploying (apps with edge_cache)
        type: boolean
        default: false
    secrets:
      TS_CI_OAUTH_CLIENT_ID:
        required: true
      TS_CI_OAUTH_SECRET:
        required: true
      CLOUDFLARE_PURGE_TOKEN:
        description: Zone › Cache Purge › Purge on xlobax.com. Required when purge_cache is true.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploys of one app-env run in order; a newer pending one replaces an older pending one.
    concurrency:
      group: deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.env }}
      url: ${{ inputs.url }}
    steps:
      - uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          oauth-client-id: ${{ secrets.TS_CI_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CI_OAUTH_SECRET }}
          tags: tag:ci

      # Inputs go through env, never straight into the script, so a value can't inject shell code.
      - name: deploy-app ${{ inputs.app }} ${{ inputs.env }} ${{ inputs.tag }}
        env:
          APP: ${{ inputs.app }}
          APP_ENV: ${{ inputs.env }}
          TAG: ${{ inputs.tag }}
        # deploy's login shell turns this into `sudo deploy-app ...` and refuses anything else.
        run: ssh -o StrictHostKeyChecking=no deploy@xlobax-vps deploy-app "$APP" "$APP_ENV" "$TAG"

      # Before the smoke test, so it fetches the new release rather than the cached old one.
      - name: Purge Cloudflare cache
        if: inputs.purge_cache
        env:
          URL: ${{ inputs.url }}
          TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE_ID: 74dc9c07ce32e56abc12074ef0da185d # xlobax.com; an ID, not a secret (terraform.tfvars)
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::purge_cache is set but CLOUDFLARE_PURGE_TOKEN is missing; the edge would keep the old release"
            exit 1
          fi
          host=$(printf '%s' "$URL" | sed -E 's#^https?://([^/:]+).*#\1#')
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"$host\"]}" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache"

      - name: Smoke test through Cloudflare
        env:
          URL: ${{ inputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$URL"
