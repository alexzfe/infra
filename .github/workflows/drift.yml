# Nightly: does the real world still match main? Fails if `terraform plan` or `ansible --check` would change
# anything (someone clicked in a dashboard, a package changed a file, a resource vanished). GitHub emails on failure.
# Read-only, so it doesn't share the `infra` concurrency group: a pending run there would replace a pending apply.
name: drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "1"
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_INFRA_OAUTH_CLIENT_ID }}
  TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_INFRA_OAUTH_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  ANSIBLE_HOST_KEY_CHECKING: "False"
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - id: collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
      - if: steps.collections.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform -chdir=terraform init -backend-config=backend.hcl

      # Exit code 2 = the plan has changes.
      - name: terraform plan
        run: |
          rc=0
          terraform -chdir=terraform plan -no-color -lock=false -detailed-exitcode > plan.txt || rc=$?
          cat plan.txt
          if [ "$rc" -eq 2 ]; then
            { echo '### Terraform drift'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # Check Ansible even when Terraform drifted, so one run reports both.
      - if: ${{ !cancelled() }}
        uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          oauth-client-id: ${{ secrets.TS_INFRA_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_INFRA_OAUTH_SECRET }}
          tags: tag:infra-ci
      - name: ansible --check --diff
        if: ${{ !cancelled() }}
        run: |
          TUNNEL_TOKEN=$(terraform -chdir=terraform output -raw tunnel_token)
          export TUNNEL_TOKEN
          echo "::add-mask::$TUNNEL_TOKEN"
          cd ansible && ansible-playbook site.yml --check --diff | tee ../ansible.txt
          if ! grep -qE ' changed=0 .*failed=0 ' ../ansible.txt; then
            { echo '### Ansible drift'; echo '```'; cat ../ansible.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
