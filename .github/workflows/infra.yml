# PR: lint, `terraform plan` and `ansible --check --diff`, both written to the job summary.
# Merge to main: `terraform apply`, then converge the server with Ansible.
name: infra

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail, so `plan | tee` still fails the job

env:
  TF_IN_AUTOMATION: "1"
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_INFRA_OAUTH_CLIENT_ID }}
  TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_INFRA_OAUTH_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  ANSIBLE_HOST_KEY_CHECKING: "False" # identity comes from Tailscale, and host keys change on rebuild
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - id: collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
      - if: steps.collections.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR" # Terraform won't create it on a cache miss
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
      - run: cd ansible && ansible-lint site.yml

  # Runs alongside lint rather than after it; both are required checks on main.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - id: collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
      - if: steps.collections.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR" # Terraform won't create it on a cache miss
      - run: terraform -chdir=terraform init -backend-config=backend.hcl
      - name: terraform plan
        run: |
          terraform -chdir=terraform plan -no-color -lock=false | tee plan.txt
          { echo '### terraform plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          oauth-client-id: ${{ secrets.TS_INFRA_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_INFRA_OAUTH_SECRET }}
          tags: tag:infra-ci
      - name: ansible --check --diff
        run: |
          TUNNEL_TOKEN=$(terraform -chdir=terraform output -raw tunnel_token)
          export TUNNEL_TOKEN
          echo "::add-mask::$TUNNEL_TOKEN"
          cd ansible && ansible-playbook site.yml --check --diff | tee ../ansible.txt
          { echo '### ansible --check --diff'; echo '```'; cat ../ansible.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - id: collections
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
      - if: steps.collections.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR" # Terraform won't create it on a cache miss
      - run: terraform -chdir=terraform init -backend-config=backend.hcl
      - run: terraform -chdir=terraform apply -auto-approve -no-color
      - uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          oauth-client-id: ${{ secrets.TS_INFRA_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_INFRA_OAUTH_SECRET }}
          tags: tag:infra-ci
      # A fresh server needs a minute or two to boot, run cloud-init and join the tailnet.
      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            tailscale ping -c 1 --timeout 5s xlobax-vps > /dev/null 2>&1 && break
            sleep 5
          done
          # Exit 2 = "done, with recoverable errors": Hetzner's own vendor-data triggers deprecation warnings.
          rc=0
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@xlobax-vps cloud-init status --wait || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]
      - name: ansible-playbook
        run: |
          TUNNEL_TOKEN=$(terraform -chdir=terraform output -raw tunnel_token)
          export TUNNEL_TOKEN
          echo "::add-mask::$TUNNEL_TOKEN"
          cd ansible && ansible-playbook site.yml
